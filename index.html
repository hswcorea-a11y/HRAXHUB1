<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HRAXHUB</title>
  <style>
    :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --accent:#2f5bea; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#141413; --fg:#f2f2ee; --muted:#a3a39c; --accent:#7d9bff; }
    }
    * { box-sizing:border-box; margin:0; }
    body { min-height:100vh; display:grid; place-items:center; padding:24px 16px;
           background:var(--bg); color:var(--fg);
           font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
    main { max-width:560px; text-align:center; }
    h1 { font-size:clamp(2.2rem,8vw,3.4rem); letter-spacing:-0.02em; }
    h1 span { color:var(--accent); }
    p { margin-top:16px; color:var(--muted); line-height:1.6; font-size:1.05rem; }
  </style>
</head>
<body>
  <main>
    <h1>HRAX<span>HUB</span></h1>
    <p>사이트를 준비하고 있습니다. 곧 새로운 모습으로 찾아뵙겠습니다.</p>
  </main>
</body>
</html>
